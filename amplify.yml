version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'Cache-Control'
              value: 'public, max-age=0, must-revalidate'
      redirects:
        - source: /repo/<*>/
          target: /index.html
          status: 200
        - source: /repo/<*>
          target: /index.html
          status: 200
        - source: /dashboard
          target: /index.html
          status: 200
        - source: /onboarding
          target: /index.html
          status: 200
        - source: /onboarding/
          target: /index.html
          status: 200
        - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
          target: /index.html
          status: 200
